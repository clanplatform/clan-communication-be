<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Notification{% endblock %}</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif; }
    .wrapper { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 32px; }
    .header { border-bottom: 2px solid #eaeaea; padding-bottom: 16px; margin-bottom: 24px; }
    .footer { border-top: 1px solid #eaeaea; padding-top: 16px; margin-top: 24px; font-size: 12px; color: #888; }
    h1 { color: #333333; font-size: 22px; }
    p { color: #555555; line-height: 1.6; }
    a.button {
      display: inline-block; padding: 12px 24px; background-color: #4F46E5;
      color: #ffffff; text-decoration: none; border-radius: 6px; margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <strong>{{ tenant_name | default("Clan Platform") }}</strong>
    </div>
    {% block content %}{% endblock %}
    <div class="footer">
      <p>© {{ year }} {{ tenant_name | default("Clan Platform") }}. All rights reserved.</p>
      <p>You received this email because you are a registered user.</p>
    </div>
  </div>
</body>
</html>
