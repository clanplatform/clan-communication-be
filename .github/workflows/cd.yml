name: CD — Build & Push Images

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  ORG: clan-platform

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: set-matrix
        run: |
          # Build matrix of changed Python services
          SERVICES=()
          declare -A SERVICE_MAP=(
            ["services/notification-service"]="notification-service:8000:python"
            ["services/email-service"]="email-service:8001:python"
            ["services/sms-service"]="sms-service:8002:python"
            ["services/push-notification-service"]="push-notification-service:8003:python"
            ["services/in-app-notification-service"]="in-app-notification-service:8004:python"
            ["services/websocket-service"]="websocket-service:8006:python"
            ["services/whatsapp-service"]="whatsapp-service:8005:python"
            ["services/whatsapp-webjs-service"]="whatsapp-webjs-service:3000:node"
          )
          for path in "${!SERVICE_MAP[@]}"; do
            if git diff --name-only HEAD~1 HEAD | grep -q "^${path}/\|^libs/"; then
              SERVICES+=("{\"service\":\"${SERVICE_MAP[$path]%%:*}\",\"path\":\"${path}\",\"port\":\"${SERVICE_MAP[$path]#*:}\",\"type\":\"${SERVICE_MAP[$path]##*:}\"}")
            fi
          done
          MATRIX=$(printf '[%s]' "$(IFS=,; echo "${SERVICES[*]}")")
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to dev cluster
        run: |
          echo "Deploying to dev via Helm..."
          # helm upgrade --install clan-communication ./deploy/helm \
          #   --namespace clan-communication \
          #   --values ./deploy/helm/values.yaml \
          #   --set global.image.tag=${{ github.sha }}
          echo "Deploy step placeholder — wire up your kubeconfig secret"
